server {
    listen 80;
    listen [::]:80;
    listen 8080;
    listen [::]:8080;
    server_name pool.example.com;

    # Cloudflare-proxied. Auth + metering handled by pool-meter (127.0.0.1:18811),
    # which validates x-api-key against pool-keys.json (multi-key) and forwards to 18807.
    # Rollback: restore pool-proxy.bak-pre-meter-20260715 (nginx if-check + direct 18807).
    client_max_body_size 20m;

    location = / {
        return 302 https://pool.example.com/docs;
    }
    location = /docs {
        default_type text/markdown;
        alias /opt/pool/services/pool-meter/public/README.md;
    }
    location / {
        proxy_pass http://127.0.0.1:18811;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }
}
